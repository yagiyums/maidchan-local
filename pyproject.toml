[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maidchan-local"
version = "0.7.1"
description = "A private, local-first Windows desktop mascot with Ollama-powered Japanese chat"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yagiyums" }]
dependencies = [
    "PySide6>=6.7,<7",
    "comtypes>=1.4,<2",
    "sounddevice>=0.5,<1",
    "vosk>=0.3.45,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6", "Pillow>=10,<13"]

[project.scripts]
maidchan-local = "maidchan.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maidchan = ["assets/*.png", "assets/*.gif"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

